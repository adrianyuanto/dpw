<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="img/png" href="https://www.bgn.go.id/logo-bgn.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Pendaftaran MABA</title>
</head>
<body>
    <div id="content">
        <fieldset>
            <legend>Form Pendaftaran Mahasiswa Baru</legend>
            <form action="proses.php" method="POST">
                <label for="nama_lengkap">Nama Lengkap:</label>
                <input type="text" id="nama_lengkap" name="nama_lengkap"><br><br>

                <label>Tempat/Tanggal Lahir:</label>
                <input type="text" name="tempat_lahir" placeholder="Tempat Lahir">
                <input type="date" name="tanggal_lahir" min="1989-01-01" max="1994-12-31"><br><br>

                <label for="agama">Agama:</label>
                <select id="agama" name="agama">
                    <option value="">-PILIH-</option>
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Budha">Budha</option>
                    <option value="Konghucu">Konghucu</option>
                </select><br><br>

                <label>Jenis Kelamin:</label>
                <input type="radio" id="jk_l" name="jenis_kelamin" value="Laki-laki">
                <label for="jk_l">Laki-laki</label>
                <input type="radio" id="jk_p" name="jenis_kelamin" value="Perempuan">
                <label for="jk_p">Perempuan</label><br><br>

                <label for="ijazah">No. Ijazah SMA/MA:</label>
                <input type="text" id="ijazah" name="no_ijazah"><br><br>

                <label for="foto">Foto (Ukuran File Maks. 20 KB):</label>
                <input type="file" id="foto" name="foto"><br><br>

                <label for="ayah">Nama Ayah:</label>
                <input type="text" id="ayah" name="nama_ayah"><br><br>

                <label for="ibu">Nama Ibu:</label>
                <input type="text" id="ibu" name="nama_ibu"><br><br>

                <label for="alamat">Alamat Rumah:</label><br>
                <textarea id="alamat" name="alamat_rumah" rows="4" cols="50"></textarea><br><br>

                <label for="telp">No. Telp:</label>
                <input type="tel" id="telp" name="no_telp"><br><br>

                <label for="sekolah">Nama Sekolah Asal:</label>
                <input type="text" id="sekolah" name="sekolah_asal"><br><br>

                <label for="alamat_sekolah">Alamat Sekolah Asal:</label><br>
                <textarea id="alamat_sekolah" name="alamat_sekolah_asal" rows="4" cols="50"></textarea><br><br>

                <label for="jurusan">Jurusan Dipilih:</label>
                <select id="jurusan" name="jurusan_dipilih">
                    <option value="">-PILIH-</option>
                    <option value="Kompak">Komputerisasi Akuntansi</option>
                    <option value="Bisnis">Administrasi Bisnis</option>
                    <option value="TKK">Teknik Komputer Kontrol</option>
                    <option value="Listrik">Teknik Listrik</option>
                    <option value="Mesin">Mesin Otomotif</option>
                    <option value="Kereta">Perkeretaapian</option>
                    <option value="TI">Teknologi Informasi</option>
                    <option value="Akuntansi">Akuntansi</option>
                </select><br><br>

                <label>Tahu informasi ini dari:</label>
                <input type="checkbox" id="info_koran" name="info_dari[]" value="Koran"> <label for="info_koran">Instagram</label>
                <input type="checkbox" id="info_web" name="info_dari[]" value="Website"> <label for="info_web">Website</label>
                <input type="checkbox" id="info_tv" name="info_dari[]" value="Televisi"> <label for="info_tv">TikTok</label>
                <input type="checkbox" id="info_radio" name="info_dari[]" value="Radio"> <label for="info_radio">Baliho</label>
                <input type="checkbox" id="info_teman" name="info_dari[]" value="Teman"> <label for="info_teman">Teman</label><br><br>

                <input type="submit" value="DAFTAR">
                <input type="reset" value="BATAL">
            </form>
        </fieldset>
    </div>
</body>
</html>
