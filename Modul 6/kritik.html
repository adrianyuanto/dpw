<h1>Kritik & Saran</h1>
<p>Berikan masukan Anda untuk pengembangan website ini</p>
</div>


<!-- FORM -->
<div class="container py-5">
<div class="form-box mx-auto" style="max-width:500px;">

<form onsubmit="kirimPesan(event)">
  
  <input type="text" class="form-control mb-3" placeholder="Nama" required>
  
  <input type="email" class="form-control mb-3" placeholder="Email" required>
  
  <select class="form-control mb-3" required>
    <option value="">Pilih Kategori</option>
    <option>Kritik</option>
    <option>Saran</option>
  </select>

  <textarea class="form-control mb-3" rows="4" placeholder="Tulis pesan Anda..." required></textarea>

  <button class="btn btn-primary w-100">Kirim</button>

</form>

</div>
</div>

<!-- ALERT -->
<div id="alertBox" class="text-center mt-4"></div>

<script>
function kirimPesan(e){
  e.preventDefault();

  document.getElementById("alertBox").innerHTML = `
    <div class="alert alert-success w-50 mx-auto">
      Pesan berhasil dikirim! Terima kasih atas masukannya 😊
    </div>
  `;
}
</script>
