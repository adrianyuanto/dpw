<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="img/png" href="https://upload.wikimedia.org/wikipedia/id/5/5f/Politeknik_Negeri_Madiun.png" sizes="16x16"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Adrian Yuanto">
    <meta name="nim" content="253307014">
    <title>Simple Selektor</title>
    <style>
        p {
            text-align: center;
            color: rgb(0, 174, 255);
            background-color: #f0f8ff;
            border: 2px solid blue;
            padding: 15px;
        }
        #kalimat {
            text-align: left;
            color: red;
            background-color: #ffe4e1;
            border: 2px solid darkred;
            padding: 15px;
        }
        .center {
            text-align: center;
            color: chocolate;
            background-color: #ffebd2;
            border: 2px dashed orange;
            padding: 15px;
        }
        p.tengah {
            text-align: center;
            color: darkmagenta;
            display: block;
            background-color: #777777;
            border: 3px double purple;
            padding: 15px;
        }
    </style>
</head>
<body>
    <p>Penggunaan CSS sangat membantu web desainer dalam menyusun halaman yang konsisten pada proyek pembuatan halaman web</p>
    <p id="kalimat">Dalam penulisan CSS sangat sederhana namun detail</p>
    <p class="center">CSS mempunyai default stylei</p>
    <p class="tengah">Ini adalah hasil selector dengan elemen p dengan class tengah</p>
</body>
</html>
