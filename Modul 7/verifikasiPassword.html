<HTML>
<HEAD>
<TITLE>Mengakses Objek password</TITLE>
</HEAD>
<BODY>
<a href="index.html" style="position: fixed; top: 20px; left: 20px; padding: 10px 15px; background: #1e293b; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-family: Arial, sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.2); z-index: 9999; font-size: 0.9rem;">⬅ Kembali</a>
<br><br><br>

<FORM NAME="formTes" ACTION="tesform.htm" METHOD="POST">
<PRE>
Password Baru  : <INPUT TYPE="PASSWORD" NAME="password_1">
Konfirmasi Password  : <INPUT TYPE="PASSWORD" NAME="password_2">
</PRE>
<INPUT TYPE="BUTTON" NAME="tombolProses" VALUE="Proses" onClick="cekPassword()">
</FORM>
<SCRIPT LANGUAGE="JavaScript">
function cekPassword() {
    if (document.formTes.password_1.value != document.formTes.password_2.value) {
        alert("Dua password yang Anda masukkan tidak sama");
    } else {
        window.location.href = "tesform.htm";
    }
}
</SCRIPT>
</BODY>
</HTML>
