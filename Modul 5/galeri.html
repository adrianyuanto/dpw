<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="img/png" href="https://upload.wikimedia.org/wikipedia/commons/7/70/Logo_Nusantara.png" sizes="16x16"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Adrian Yuanto">
    <meta name="nim" content="253307014">
    <title>Galeri Flexbox 4 Kolom</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 15px; 
        }
        .gallery-item {
            width: calc(25% - 15px); 
            background-color: white;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover; 
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>Galeri Flexbox 4 Kolom</h2>
    <div class="gallery-container">
        <div class="gallery-item"><img src="https://i.pinimg.com/736x/ae/82/d6/ae82d611f2fcc9841fa7ffee65964bb0.jpg" alt="Foto 1"><p>Foto 1</p></div>
        <div class="gallery-item"><img src="https://i.pinimg.com/736x/ff/99/77/ff9977f03503692d80deb1e587dd8180.jpg" alt="Foto 2"><p>Foto 2</p></div>
        <div class="gallery-item"><img src="https://i.pinimg.com/736x/42/93/10/4293105dc2ba446c35a9e449240553c0.jpg" alt="Foto 3"><p>Foto 3</p></div>
        <div class="gallery-item"><img src="https://i.pinimg.com/736x/aa/02/4d/aa024d54bea44ed67ccee2663eaebd5e.jpg" alt="Foto 4"><p>Foto 4</p></div>
        
        </div>
</body>
</html>
