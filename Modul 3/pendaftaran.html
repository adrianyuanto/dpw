    <article>
    <h1>Form Penjadwal Pertemuan</h1>
    <form action="proses.php" method="POST">
        
        <fieldset>
            <legend>Informasi Pribadi</legend>
            <label>Nama:</label><br>
            <input type="text" name="nama" required><br><br>

            <label>No. Telepon (Format: XXXX-XXXXXX):</label><br>
            <input type="tel" name="telepon" pattern="[0-9]{4}-[0-9]{6}" title="Format harus 4 angka - 6 angka" required><br><br>

            <label>Alamat Email:</label><br>
            <input type="email" name="email" required><br><br>

            <label>Tanggal Lahir (1987 - 1993):</label><br>
            <input type="date" name="tgl_lahir" min="1987-01-01" max="1993-12-31"><br><br>
        </fieldset>
        
        <br>

        <fieldset>
            <legend>Permintaan Pertemuan</legend>
            <label>Tujuan Pertemuan:</label><br>
            <input type="text" name="tujuan_pertemuan" required><br><br>

            <label>Tingkat Kepentingan Pertemuan (0-10):</label><br>
            <input type="range" name="tingkat_kepentingan" min="0" max="10" value="5"><br><br>

            <label>Tanggal (Harus setelah hari ini):</label><br>
            <input type="date" name="tgl_pertemuan" min="2026-03-14" required><br><br>

            <label>Waktu (17.00 - 21.00):</label><br>
            <input type="time" name="waktu_pertemuan" min="17:00" max="21:00" required><br><br>
        </fieldset>

        <br>
        <input type="submit" value="Submit">
    </form>
