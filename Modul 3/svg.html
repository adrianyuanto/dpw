    <h1>Grafik Vektor (SVG)</h1>
    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" />
    </svg>
    <svg width="100" height="100">

    </svg>
    <svg width="100" height="100">
        <polygon points="50,10 90,90 10,90" style="fill:lime; stroke:purple; stroke-width:1" />
    </svg>
    <p><strong>Kesimpulan:</strong> Elemen <code>&lt;svg&gt;</code> dapat membuat gambar grafik tidak pecah karena langsung dibuaat pada HTML.</p>
